    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E95D6"/>
      <stop offset="1" stop-color="#2D5BA6"/>
    </linearGradient>
    <pattern id="mul" width="28" height="10" patternUnits="userSpaceOnUse">
