  <path d="M90 300h720l-40 22H130z" fill="#FFFFFF"/>
  <path d="M90 300h720" stroke="#C9D8EF" stroke-width="2"/>
  <rect x="150" y="322" width="600" height="90" fill="#1F3E73"/>
  <rect x="150" y="322" width="600" height="90" fill="url(#mul)"/>
  <rect x="170" y="336" width="560" height="62" fill="#FFE3A8" opacity="0.22"/>
  <g fill="#FFFFFF"><rect x="148" y="322" width="8" height="90"/><rect x="446" y="322" width="8" height="90"/><rect x="744" y="322" width="8" height="90"/></g>
  <rect x="120" y="412" width="660" height="10" fill="#E6EEFB"/>
