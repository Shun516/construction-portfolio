<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB4F5"/>
      <stop offset="1" stop-color="#E6EEFB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3C6FC4"/>
      <stop offset="0.5" stop-color="#A8C6F4"/>
      <stop offset="1" stop-color="#1F4A93"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D8EF"/>
      <stop offset="1" stop-color="#8EA8D2"/>
    </linearGradient>
    <pattern id="band" width="10" height="16" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.5" fill="#fff" opacity="0.4"/>
    </pattern>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#fff" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.55">
    <ellipse cx="250" cy="170" rx="120" ry="22"/><ellipse cx="330" cy="150" rx="70" ry="18"/>
    <ellipse cx="960" cy="230" rx="140" ry="20"/>
  </g>
  <!-- background buildings -->
  <g fill="url(#glass2)">
    <rect x="120" y="430" width="140" height="370"/><rect x="280" y="380" width="110" height="420"/>
    <rect x="820" y="400" width="130" height="400"/><rect x="970" y="460" width="150" height="340"/>
  </g>
  <g fill="url(#grid)">
    <rect x="120" y="430" width="140" height="370"/><rect x="280" y="380" width="110" height="420"/>
    <rect x="820" y="400" width="130" height="400"/><rect x="970" y="460" width="150" height="340"/>
  </g>
  <!-- main tower -->
  <path d="M510 800V150q90-60 180 0v650z" fill="url(#glass)"/>
  <path d="M510 800V150q90-60 180 0v650z" fill="url(#band)"/>
  <path d="M600 112v688" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <path d="M600 40v74" stroke="#1F4A93" stroke-width="4"/>
  <rect x="490" y="720" width="220" height="80" fill="#14294D"/>
  <rect x="510" y="736" width="180" height="50" fill="#FFE3A8" opacity="0.35"/>
  <!-- ground -->
  <rect y="780" width="1200" height="20" fill="#14294D"/>
  <g fill="#5E8C5A">
    <circle cx="430" cy="770" r="20"/><circle cx="460" cy="776" r="14"/><circle cx="760" cy="770" r="20"/><circle cx="790" cy="776" r="14"/>
  </g>
</svg>
