<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E95D6"/>
      <stop offset="1" stop-color="#DCE6F5"/>
    </linearGradient>
    <pattern id="lv" width="14" height="10" patternUnits="userSpaceOnUse">
      <rect width="4" height="10" fill="#F7FAFF" opacity="0.85"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <!-- stepped terraces -->
  <rect x="140" y="340" width="620" height="180" fill="#1F3E73"/>
  <rect x="140" y="340" width="620" height="180" fill="url(#lv)"/>
  <rect x="220" y="230" width="460" height="110" fill="#2D5BA6"/>
  <rect x="220" y="230" width="460" height="110" fill="url(#lv)"/>
  <rect x="320" y="140" width="260" height="90" fill="#3C6FC4"/>
  <rect x="320" y="140" width="260" height="90" fill="url(#lv)"/>
  <!-- green roofs -->
  <g fill="#6F8F7A"><rect x="130" y="330" width="90" height="12"/><rect x="680" y="330" width="90" height="12"/><rect x="210" y="220" width="110" height="12"/><rect x="580" y="220" width="110" height="12"/><rect x="310" y="130" width="280" height="12"/></g>
  <g fill="#5E8C5A"><circle cx="160" cy="324" r="10"/><circle cx="740" cy="324" r="10"/><circle cx="250" cy="214" r="10"/><circle cx="650" cy="214" r="10"/><circle cx="380" cy="124" r="9"/><circle cx="520" cy="124" r="9"/></g>
  <!-- atrium -->
  <rect x="380" y="400" width="140" height="120" fill="#FFE3A8" opacity="0.55"/>
  <rect y="520" width="900" height="80" fill="#E6EEFB"/>
  <g stroke="#C3D1E8" stroke-width="2"><path d="M0 550h900M450 520v80"/></g>
</svg>
