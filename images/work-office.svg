<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DBDF3"/>
      <stop offset="1" stop-color="#EEF3FB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D86CF"/>
      <stop offset="0.5" stop-color="#C2D6F6"/>
      <stop offset="1" stop-color="#2D5BA6"/>
    </linearGradient>
    <pattern id="fin" width="30" height="10" patternUnits="userSpaceOnUse">
      <rect width="6" height="10" fill="#F7FAFF"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <!-- office block with white vertical fins -->
  <rect x="230" y="90" width="440" height="430" fill="url(#glass)"/>
  <rect x="230" y="90" width="440" height="430" fill="url(#fin)"/>
  <g fill="#F7FAFF"><rect x="220" y="80" width="460" height="14"/><rect x="230" y="300" width="440" height="6"/></g>
  <!-- recessed sky garden -->
  <rect x="230" y="306" width="440" height="40" fill="#14294D"/>
  <g fill="#5E8C5A"><circle cx="280" cy="336" r="14"/><circle cx="400" cy="336" r="14"/><circle cx="520" cy="336" r="14"/><circle cx="630" cy="336" r="14"/></g>
  <!-- entrance canopy -->
  <rect x="200" y="470" width="500" height="10" fill="#F7FAFF"/>
  <rect x="300" y="480" width="300" height="40" fill="#FFE3A8" opacity="0.5"/>
  <rect y="520" width="900" height="80" fill="#D6E2F4"/>
  <path d="M0 548h900" stroke="#B4C7E6" stroke-width="2"/>
  <g fill="#5E8C5A"><circle cx="120" cy="490" r="36"/><circle cx="780" cy="490" r="36"/></g>
</svg>
