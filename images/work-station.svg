<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA7EC"/>
      <stop offset="1" stop-color="#E3ECFA"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2D5BA6"/>
      <stop offset="1" stop-color="#7FA7EC"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D8EF"/>
      <stop offset="1" stop-color="#93AED8"/>
    </linearGradient>
    <pattern id="win" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="10" height="8" fill="#fff" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <!-- three towers -->
  <rect x="120" y="180" width="170" height="320" fill="url(#g2)"/>
  <rect x="120" y="180" width="170" height="320" fill="url(#win)"/>
  <rect x="360" y="70" width="190" height="430" fill="url(#g1)"/>
  <rect x="360" y="70" width="190" height="430" fill="url(#win)"/>
  <rect x="352" y="60" width="206" height="12" fill="#14294D"/>
  <rect x="620" y="210" width="170" height="290" fill="url(#g2)"/>
  <rect x="620" y="210" width="170" height="290" fill="url(#win)"/>
  <!-- podium -->
  <rect x="90" y="430" width="730" height="70" fill="#F7FAFF"/>
  <rect x="110" y="446" width="690" height="40" fill="#1F3E73"/>
  <rect x="110" y="446" width="690" height="40" fill="#FFE3A8" opacity="0.25"/>
  <!-- pedestrian deck -->
  <path d="M0 500h900v14H0z" fill="#E6EEFB"/>
  <path d="M0 500h900" stroke="#1D5FD6" stroke-width="3"/>
  <g fill="#C3D1E8"><rect x="120" y="514" width="14" height="86"/><rect x="420" y="514" width="14" height="86"/><rect x="720" y="514" width="14" height="86"/></g>
  <!-- train -->
  <rect x="0" y="556" width="900" height="44" fill="#14294D"/>
  <rect x="180" y="530" width="520" height="30" rx="6" fill="#F7FAFF"/>
  <rect x="180" y="548" width="520" height="5" fill="#1D5FD6"/>
  <g fill="#2D5BA6"><rect x="200" y="535" width="40" height="10"/><rect x="260" y="535" width="40" height="10"/><rect x="320" y="535" width="40" height="10"/><rect x="380" y="535" width="40" height="10"/><rect x="440" y="535" width="40" height="10"/><rect x="500" y="535" width="40" height="10"/><rect x="560" y="535" width="40" height="10"/><rect x="620" y="535" width="40" height="10"/></g>
  <!-- trees on deck -->
  <g fill="#5E8C5A"><circle cx="300" cy="488" r="16"/><circle cx="590" cy="488" r="16"/></g>
</svg>
