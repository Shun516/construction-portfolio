<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1A30"/>
      <stop offset="0.45" stop-color="#1A3A6E"/>
      <stop offset="0.78" stop-color="#4E79C4"/>
      <stop offset="1" stop-color="#A9C3EC"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3866"/>
      <stop offset="0.55" stop-color="#2D5BA6"/>
      <stop offset="1" stop-color="#14294D"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13284A"/>
      <stop offset="1" stop-color="#22457F"/>
    </linearGradient>
    <linearGradient id="glassC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3466B8"/>
      <stop offset="1" stop-color="#173263"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4F8F"/>
      <stop offset="1" stop-color="#0E2142"/>
    </linearGradient>
    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="9" height="11" fill="#8FB4F5" opacity="0.18"/>
    </pattern>
    <pattern id="winLit" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="9" height="11" fill="#FFE3A8" opacity="0.5"/>
    </pattern>
    <pattern id="mullion" width="24" height="10" patternUnits="userSpaceOnUse">
      <rect width="1" height="10" fill="#9DBDF3" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="180" cy="90" r="1.4"/><circle cx="420" cy="160" r="1"/><circle cx="640" cy="70" r="1.2"/>
    <circle cx="900" cy="120" r="1"/><circle cx="1180" cy="60" r="1.3"/><circle cx="1480" cy="140" r="1"/>
  </g>

  <!-- far skyline -->
  <g fill="#244A86" opacity="0.7">
    <rect x="0" y="640" width="90" height="360"/><rect x="100" y="600" width="70" height="400"/>
    <rect x="180" y="660" width="110" height="340"/><rect x="300" y="580" width="60" height="420"/>
    <rect x="370" y="630" width="120" height="370"/><rect x="500" y="560" width="80" height="440"/>
    <rect x="590" y="620" width="90" height="380"/><rect x="1500" y="600" width="100" height="400"/>
  </g>

  <!-- crane -->
  <g stroke="#9DBDF3" stroke-width="3" fill="none" opacity="0.8">
    <path d="M1420 300v400M1440 300v400M1420 320l20 20M1440 340l-20 20M1420 360l20 20M1440 380l-20 20M1420 400l20 20M1440 420l-20 20M1420 440l20 20M1440 460l-20 20M1420 480l20 20"/>
    <path d="M1250 300h330M1250 312h330M1430 300l-20-40 40 0z"/>
    <path d="M1300 312v120"/>
  </g>
  <rect x="1288" y="432" width="24" height="16" fill="#9DBDF3" opacity="0.8"/>
  <circle cx="1430" cy="258" r="4" fill="#FF6B5B"/>

  <!-- main tower (tapered) -->
  <path d="M1010 1000V230l70-90 70 90v770z" fill="url(#glassA)"/>
  <path d="M1010 1000V230l70-90 70 90v770z" fill="url(#mullion)"/>
  <path d="M1080 140v860" stroke="#B8D0F7" stroke-width="2" opacity="0.4"/>
  <path d="M1080 60v80" stroke="#B8D0F7" stroke-width="3"/>
  <circle cx="1080" cy="58" r="4" fill="#FF6B5B"/>

  <!-- tower 2 -->
  <rect x="820" y="360" width="160" height="640" fill="url(#glassB)"/>
  <rect x="820" y="360" width="160" height="640" fill="url(#win)"/>
  <rect x="862" y="520" width="56" height="200" fill="url(#winLit)"/>
  <rect x="820" y="350" width="160" height="10" fill="#0E2142"/>

  <!-- tower 3 (angled top) -->
  <path d="M1180 1000V420l140-60v640z" fill="url(#glassC)"/>
  <path d="M1180 1000V420l140-60v640z" fill="url(#win)"/>
  <rect x="1222" y="600" width="70" height="160" fill="url(#winLit)"/>

  <!-- tower 4 -->
  <rect x="700" y="480" width="110" height="520" fill="#1A3566"/>
  <rect x="700" y="480" width="110" height="520" fill="url(#win)"/>
  <rect x="1340" y="520" width="150" height="480" fill="#162E58"/>
  <rect x="1340" y="520" width="150" height="480" fill="url(#win)"/>
  <rect x="1368" y="700" width="70" height="120" fill="url(#winLit)"/>

  <!-- museum (low, long roof) in foreground -->
  <path d="M560 860l60-40h700l60 40z" fill="#E9F0FB"/>
  <rect x="610" y="860" width="720" height="70" fill="#0E2142"/>
  <rect x="610" y="860" width="720" height="70" fill="url(#mullion)"/>
  <rect x="640" y="872" width="660" height="46" fill="#FFE3A8" opacity="0.22"/>
  <g fill="#E9F0FB"><rect x="640" y="860" width="6" height="70"/><rect x="900" y="860" width="6" height="70"/><rect x="1160" y="860" width="6" height="70"/><rect x="1294" y="860" width="6" height="70"/></g>

  <!-- water / reflection -->
  <rect x="0" y="930" width="1600" height="70" fill="url(#water)"/>
  <g stroke="#9DBDF3" stroke-width="2" opacity="0.35">
    <path d="M660 950h180M900 966h260M1040 984h120M720 980h90M1200 950h100"/>
  </g>
</svg>
