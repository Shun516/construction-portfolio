<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C3EC"/>
      <stop offset="1" stop-color="#EEF3FB"/>
    </linearGradient>
    <pattern id="louver" width="18" height="10" patternUnits="userSpaceOnUse">
      <rect width="8" height="10" fill="#B88A5E"/>
    </pattern>
    <pattern id="glass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2D5BA6"/>
      <path d="M40 0H0V40" fill="none" stroke="#9DBDF3" stroke-width="1.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <!-- building -->
  <rect x="130" y="130" width="640" height="380" fill="url(#glass)"/>
  <rect x="130" y="130" width="640" height="380" fill="url(#louver)" opacity="0.92"/>
  <!-- slabs -->
  <g fill="#F7FAFF">
    <rect x="110" y="120" width="680" height="14"/><rect x="120" y="200" width="660" height="8"/>
    <rect x="120" y="276" width="660" height="8"/><rect x="120" y="352" width="660" height="8"/>
    <rect x="120" y="428" width="660" height="8"/>
  </g>
  <!-- glazed entrance -->
  <rect x="330" y="436" width="240" height="74" fill="#14294D"/>
  <rect x="345" y="446" width="210" height="64" fill="#FFE3A8" opacity="0.45"/>
  <path d="M450 446v64" stroke="#14294D" stroke-width="4"/>
  <!-- ground and trees -->
  <rect y="510" width="900" height="90" fill="#DCE5F3"/>
  <path d="M0 540h900" stroke="#C3D1E8" stroke-width="2"/>
  <g fill="#5E8C5A">
    <circle cx="70" cy="470" r="46"/><circle cx="110" cy="490" r="30"/>
    <circle cx="830" cy="470" r="46"/><circle cx="790" cy="490" r="30"/>
  </g>
  <g fill="#4A5668"><rect x="68" y="500" width="5" height="12"/><rect x="828" y="500" width="5" height="12"/></g>
</svg>
